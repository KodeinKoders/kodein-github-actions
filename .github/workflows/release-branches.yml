name: release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Check the release
        uses: KodeinKoders/kodein-github-actions/version-check@main
        with:
          release-name: ${{ github.event.release.name }}
          # This project has no Gradle version: its actions are versioned by their release only.
          check-gradle: false
      - name: Update the release branch
        uses: KodeinKoders/kodein-github-actions/release-branches@main
        with:
          release-name: ${{ github.event.release.name }}
          skip-release-prefix: true
