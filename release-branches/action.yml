name: Release branches
description: Points the release/v{Major}.{Minor} branch (or v{Major}.{Minor}, see skip-release-prefix) at the commit of a release, creating it if needed.
inputs:
  releaseName:
    description: 'Name of the release being created, e.g. 3.5.2'
    required: true
  commit:
    description: 'Commit the release branch must point to'
    default: ${{ github.sha }}
  token:
    description: 'Token used to create and update the branch. It needs the contents: write permission.'
    default: ${{ github.token }}
  skip-release-prefix:
    description: 'Whether to omit the release/ prefix of the branch: v1.2 instead of release/v1.2'
    default: 'false'
runs:
  using: node24
  main: dist/index.mjs
