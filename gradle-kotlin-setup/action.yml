name: Setup
description: Setup a Gradle Kotlin project
inputs:
  java-version:
    description: Version of the JVM SDK to setup
    default: '17'
  konan:
    description: Whether to setup Konan
    default: 'true'
runs:
  using: "composite"
  steps:
    - name: Check out
      uses: actions/checkout@v7
    - name: Set up JDK Temurin ${{ inputs.java-version }}
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Cached Konan
      if: ${{ inputs.konan == 'true' }}
      uses: actions/cache@v6
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ hashFiles('**/gradle/libs.versions.toml', '**/*.gradle*') }}
        restore-keys: konan-${{ runner.os }}-