name: Version check
description: Checks that the release name, its tag, the Gradle version, the README.adoc version and the Antora documentation versions agree.
inputs:
  release-name:
    description: 'Name of the release being created, e.g. 3.5.2'
    required: true
  tag-name:
    description: 'Name of the tag of the release, which must be the release name prefixed by v, e.g. v3.5.2'
    default: ${{ github.event.release.tag_name }}
  check-gradle:
    description: 'Whether to check that all the projects of the Gradle build have the release name as version, by running Gradle (which must be set up)'
    default: 'true'
  gradle-build-path:
    description: 'Path of the Gradle build to check, relative to the repository root, when it is one of the builds included by the root build (defaults to the repository root): Gradle is run on it with -p, and its gradle/libs.versions.toml is read from there'
    default: '.'
runs:
  using: node24
  main: dist/index.mjs
