name: Version check
description: Checks that the release name, its tag, the Gradle version and the Antora documentation versions agree.
inputs:
  release-name:
    description: 'Name of the release being created, e.g. 3.5.2'
    required: true
  tag-name:
    description: 'Name of the tag of the release, which must be the release name prefixed by v, e.g. v3.5.2'
    default: ${{ github.event.release.tag_name }}
  check-gradle:
    description: 'Whether to check the version of the Gradle build, in its root build.gradle.kts'
    default: 'true'
  gradle-directory:
    description: 'Directory of the Gradle build, relative to the repository root: its build.gradle.kts and gradle/libs.versions.toml are read from there (defaults to the repository root)'
    default: '.'
runs:
  using: node24
  main: dist/index.mjs
